name: setup
description: The toolchain and dependencies every ci and release job starts from.

inputs:
  registry-url:
    description: The npm registry to set up auth for, read from NODE_AUTH_TOKEN. Empty sets up none.
    default: ""
  store-cache:
    description: Whether to restore and save the pnpm store. A release build turns it off.
    default: "true"

runs:
  using: composite
  steps:
    # Before Setup Node, which needs pnpm on the PATH to cache its store.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: ${{ inputs.store-cache == 'true' && 'pnpm' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
