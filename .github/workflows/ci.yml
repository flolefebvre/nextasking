name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this gate before publishing.
  workflow_call:

# Cancel superseded runs, except on main, where every push keeps its run. Under release.yml,
# `github.workflow` is `release`, so the group is `release-refs/tags/vX.Y.Z`: keep release.yml's
# own group distinct from that, or this would cancel the release run that called it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The `gate` line in package.json: one job per stage, one step per script, so a failure names itself.
# Add a check in both.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # After the install, so the restored caches land in an existing node_modules.
      - name: Restore Prettier and ESLint caches
        uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-static-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-static-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Duplication
        run: pnpm duplication

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        image: [valkey/valkey:8, valkey/valkey:9, redis:7.4, redis:8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test
        env:
          NEXTASKING_TEST_IMAGE: ${{ matrix.image }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # After Build, in the same job: both read the built dist.
      - name: Pack check
        run: pnpm pack:check

      - name: Typecheck dist
        run: pnpm typecheck:dist

  # The gate's last stage. It reads the built dist too, but runs as a job of its own, once per Next
  # version: the lowest the peer range admits and the newest.
  e2e:
    name: e2e (next ${{ matrix.next-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        next-version: [16.0.10, latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: E2E
        run: pnpm test:e2e
        env:
          NEXTASKING_E2E_NEXT_VERSION: ${{ matrix.next-version }}

  # The main ruleset requires a check named `ci`: keep this job's name. A skipped required check
  # counts as passing, so this job runs whatever the others did and fails unless every one succeeded.
  ci:
    if: ${{ !cancelled() }}
    needs: [static, test, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS"
